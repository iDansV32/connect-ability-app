<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1440, initial-scale=1"/>
  <!--
    Content Security Policy. Locks the renderer to local resources only.
    'unsafe-eval' and 'unsafe-inline' are required by @babel/standalone to run
    and inject the in-browser JSX transform (vendor/babel.min.js). Removing
    both requires precompiling JSX → JS at build time, tracked as a separate
    slice.
    Fonts (General Sans + Geist Mono) are self-hosted under fonts/ and loaded
    via @font-face in styles/tokens.css, so no external font origins are
    needed. The 'unsafe-inline' on style-src is for the inline <style> tags
    React inlines from JSX.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';"/>
  <title>Connect-Ability</title>
  <link rel="stylesheet" href="styles/tokens.css"/>
  <link rel="stylesheet" href="styles/app.css"/>
  <link rel="stylesheet" href="styles/workflow.css"/>
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#f7f9fb"/>
      <rect x="25" y="25" width="50" height="50" rx="10" fill="#1b4da8"/>
      <text x="50" y="58" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#ffffff">C</text>
    </svg>
  </template>
</head>
<body>
  <div id="root"></div>

  <!--
    Vendored from unpkg.com (react@18.3.1, react-dom@18.3.1,
    @babel/standalone@7.29.0). SHA-384 hashes of these files match the
    integrity hashes the old CDN-load relied on; verified at vendor time.
    Re-vendoring instructions in docs/vendor-frontend-libs.md.
  -->
  <script src="vendor/react.development.js"></script>
  <script src="vendor/react-dom.development.js"></script>
  <script src="vendor/babel.min.js"></script>

  <script type="text/babel" src="src/icons.jsx"></script>

</body>
